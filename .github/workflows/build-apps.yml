# Builds the Mac and Windows apps on GitHub's machines.
# Publish a release on GitHub and the installers are attached to it.
# The release tag should match "version" in package.json (v0.2.0 for 0.2.0).
# Running it by hand from the Actions tab
# builds them as downloadable artifacts without making a release.
name: Build apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skip install scripts: electron-builder fetches Electron itself,
      # and the app downloads cloudflared on first use.
      - run: npm ci --ignore-scripts

      - name: Check the rules still hold up
        run: node test/botgames.js 300

      - name: Build and publish
        run: npx electron-builder --publish ${{ github.event_name == 'release' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: council-of-elders-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
